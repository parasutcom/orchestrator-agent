# .rubocop.yml
inherit_from:
  - .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 2.6
  NewCops: enable

# Override generated defaults:
Metrics/LineLength:
  Max: 135

Metrics/BlockLength:
  Max: 100

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/MethodLength:
  Max: 35

Metrics/ClassLength:
  Max: 120

Style/Documentation:
  Enabled: false